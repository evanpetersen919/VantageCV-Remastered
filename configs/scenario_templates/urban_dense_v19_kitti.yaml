# Urban Dense as urban_dense_v18.yaml (cyclists, scanned vegetation, markings, signal states) with the pedestrian
# occupancy cut to KITTI's level for the LiDAR follow-up study (docs/lidar/followup_preregistration.md): the audit
# measured 3.9 pedestrians within 40 m per synthetic frame against KITTI's 0.57 (78% of KITTI frames have none).
# An occupancy fraction drawn per scenario in [0, 0.1] (mean 0.05, one sixth of v18's 0.3) is the design value.
version: "1.0"
scenario_type: urban_dense

road_network:
  lane_markings: true
  signal_states: true
  foliage: true
  photoreal_trees: true
  cyclists: true
  cyclist_run_probability: 0.2       # about 10 per city; a design choice, the rider views aim at them
  lawn_variants: true
  paint_wear: 0.6                    # chipped lines (design choice, src/procedural/lane_markings.py)
  planting: true
  street_tree_spacing_m: 15.5       # design choice to reach the real vegetation share (Epic measured 20.21)
  avg_block_size: [80.0, 150.0]      # meters, uniform range
  avg_road_width: 12.0               # meters
  num_intersections: [4, 9]
  intersection_types: ["4way", "3way"]

buildings:
  building_density: 0.8              # coverage ratio
  building_heights: [20.0, 40.0]     # meters
  road_setback_meters: 2.0           # narrow sidewalk, buildings close to the curb
  parking_lot_fraction: 0.1          # share of blocks holding a surface lot (design choice)

traffic:
  traffic_density: [0.6, 1.0]
  # v7 fleet (see city_sample_assets.FLEET_MODEL_WEIGHTS): pickups and vans count as cars, as
  # BDD100K does (its trucks are 4.1% of car boxes; the US pickup share alone is 18%). City
  # Sample has no SUV model, so "sedan" stands in for cars and SUVs. Shares: trucks 4% and
  # buses 1.5% of vehicles = 4.3% and 1.6% of car boxes, the measured BDD100K ratios
  # (0.42 and 0.16 per image against 10.2 cars).
  fleet: v7
  vehicle_mix:
    sedan: 0.74
    suv: 0.205
    truck: 0.04
    bus: 0.015
  # The v6 value: constant, the density the v5/v5b images (2.5 persons per image) were made with.
  pedestrian_density_fraction: [0.0, 0.1]   # v18: [0.3, 0.3]; see the header
  pedestrian_density_skew: 1.0
  pedestrian_source: rocketbox

complexity_score: 80
